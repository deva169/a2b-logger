<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2B Consumption Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F7F6F3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1A1916;font-size:15px}
.app{max-width:460px;margin:0 auto;padding:12px 12px 60px}
.topbar{display:flex;align-items:center;gap:10px;background:#185FA5;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.logo{width:36px;height:36px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#185FA5;flex-shrink:0}
.ttl{color:#fff;flex:1}.ttl h1{font-size:15px;font-weight:700}.ttl p{font-size:11px;opacity:.7;margin-top:1px}
.pill{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 9px;font-size:11px;color:#fff;display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:#4DF7B0;animation:pu 1.8s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.prog{display:flex;gap:4px;margin-bottom:14px}
.pd{flex:1;height:3px;border-radius:2px;background:#E2E0D8;transition:background .25s}
.pd.on{background:#1D9E75}
.step{display:none}.step.on{display:block}
.card{background:#fff;border-radius:14px;border:1px solid #E2E0D8;overflow:hidden;margin-bottom:12px}
.crow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #E2E0D8}
.crow:last-child{border-bottom:none}
.clbl{font-size:12px;color:#7A7870;min-width:76px}
select,input[type=date]{flex:1;border:none;background:transparent;color:#1A1916;font-size:14px;font-family:inherit;outline:none;text-align:right;padding:0}
.slbl{font-size:12px;color:#7A7870;margin-bottom:8px;padding:0 2px}

/* Category tabs */
.cat-tabs{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid #E2E0D8;margin-bottom:12px;background:#fff}
.ctab{flex:1;padding:10px 4px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;border:none;background:transparent;font-family:inherit;color:#7A7870;border-right:1px solid #E2E0D8;position:relative;line-height:1.2}
.ctab:last-child{border-right:none}
.ctab.on{background:#185FA5;color:#fff}
.ctab.on.cG{background:#1D9E75}
.ctab.on.cV{background:#185FA5}
.ctab.on.cS{background:#993556}
.ctab.on.cP{background:#854F0B}
.ctab .badge-cnt{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:#E53935;color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
.ctab .badge-cnt.show{display:flex}

.srchwrap{position:relative;margin-bottom:10px}
.srchwrap input{width:100%;border:1px solid #E2E0D8;border-radius:10px;background:#fff;padding:11px 12px 11px 38px;font-size:14px;color:#1A1916;font-family:inherit;outline:none}
.srchwrap input:focus{border-color:#185FA5}
.sico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#7A7870;pointer-events:none}
.ilist{border-radius:12px;border:1px solid #E2E0D8;overflow:hidden;max-height:320px;overflow-y:auto;margin-bottom:10px;background:#fff}
.irow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #E2E0D8;cursor:pointer}
.irow:last-child{border-bottom:none}
.irow.on{background:#E1F5EE}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid #E2E0D8;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk.on{background:#1D9E75;border-color:#1D9E75}
.chk.on::after{content:'';display:block;width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.iname{flex:1;font-size:14px}
.iunit{font-size:12px;color:#7A7870}
.nores{padding:30px;text-align:center;color:#7A7870;font-size:14px}
.scnt{font-size:12px;color:#7A7870;margin-bottom:8px;padding:0 2px}

/* Summary bar */
.sumbar{background:#fff;border:1px solid #E2E0D8;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sumbar-txt{font-size:13px;color:#7A7870}
.sumbar-cnt{font-size:14px;font-weight:600;color:#1D9E75}

/* Qty */
.qlist{border-radius:12px;border:1px solid #E2E0D8;overflow:hidden;margin-bottom:12px;background:#fff}
.qrow{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #E2E0D8}
.qrow:last-child{border-bottom:none}
.qcat{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-right:2px;flex-shrink:0}
.qcG{background:#E1F5EE;color:#085041}.qcV{background:#E6F1FB;color:#0C3D6E}
.qcS{background:#FBEAF0;color:#5E1A30}.qcP{background:#FAEEDA;color:#4A2906}
.qname{flex:1;font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qunit{font-size:11px;color:#7A7870;min-width:24px}
.qbtn{width:32px;height:32px;border-radius:8px;border:1px solid #E2E0D8;background:#F7F6F3;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;color:#1A1916}
.qin{width:56px;padding:5px 4px;border:1px solid #E2E0D8;border-radius:8px;font-size:14px;text-align:center;background:#F7F6F3;color:#1A1916;font-family:inherit}
.qin:focus{outline:none;border-color:#185FA5}
textarea{width:100%;border:1px solid #E2E0D8;border-radius:12px;background:#fff;color:#1A1916;font-size:14px;font-family:inherit;padding:12px 14px;resize:none;outline:none;margin-bottom:12px}

.btnrow{display:flex;gap:8px}
.bmain{flex:1;padding:15px;border-radius:12px;border:none;background:#1A1916;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.bmain.grn{background:#1D9E75}
.bmain:disabled{opacity:.5}
.bsec{padding:15px 18px;border-radius:12px;border:1px solid #E2E0D8;background:#fff;color:#1A1916;font-size:15px;cursor:pointer;font-family:inherit}
.rvrow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #E2E0D8;font-size:13px}
.rvrow:last-child{border-bottom:none}
.rvlbl{color:#7A7870}.rvval{font-weight:500;text-align:right;max-width:60%}
.rvsec{padding:8px 14px;background:#F7F6F3;font-size:11px;font-weight:700;color:#7A7870;letter-spacing:.04em;border-bottom:1px solid #E2E0D8}
.succ{background:#E1F5EE;border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:14px}
.tick{width:52px;height:52px;border-radius:50%;background:#1D9E75;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.tick::after{content:'';display:block;width:22px;height:13px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(2px,-2px)}
.succ h2{font-size:18px;font-weight:700;color:#085041;margin-bottom:4px}
.succ p{font-size:14px;color:#1D9E75}
.wawrap{background:#e5ddd5;border-radius:14px;padding:12px;margin-bottom:10px}
.wamsg{background:#dcf8c6;border-radius:10px 10px 3px 10px;padding:10px 12px;font-size:13px;line-height:1.55;color:#111;display:inline-block;max-width:100%;white-space:pre-wrap;word-break:break-word}
.cpybtn{width:100%;padding:14px;border-radius:12px;border:1.5px solid #1D9E75;background:#fff;color:#1D9E75;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:8px}
.cpdone{text-align:center;font-size:13px;color:#1D9E75;margin-bottom:8px;display:none}
.err{background:#FDECEA;border-radius:10px;padding:10px 14px;font-size:13px;color:#C0392B;margin-top:10px;display:none}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="logo">A2B</div>
  <div class="ttl"><h1>Consumption Logger</h1><p>Harrisdale &amp; Yokine</p></div>
  <div class="pill"><span class="dot"></span>Live</div>
</div>

<div class="prog">
  <div class="pd on" id="p1"></div>
  <div class="pd" id="p2"></div>
  <div class="pd" id="p3"></div>
</div>

<!-- STEP 1: Info -->
<div class="step on" id="s1">
  <div class="card">
    <div class="crow"><span class="clbl">Restaurant</span>
      <select id="f-store"><option>Harrisdale A2B</option><option>Yokine A2B</option></select>
    </div>
    <div class="crow"><span class="clbl">Date</span><input type="date" id="f-date"></div>
    <div class="crow"><span class="clbl">Logged by</span>
      <select id="f-who"><option>Chef — Kitchen</option><option>Manager</option><option>Other</option></select>
    </div>
  </div>
  <div class="btnrow"><button class="bmain" id="btn-n1">Next — select items</button></div>
</div>

<!-- STEP 2: Category tabs + item selection + qty -->
<div class="step" id="s2">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <span style="font-size:13px;color:#7A7870" id="s2-lbl"></span>
    <span style="font-size:13px;font-weight:600;color:#1D9E75" id="s2-total">0 items</span>
  </div>

  <!-- Tabs -->
  <div class="cat-tabs">
    <button class="ctab cG on" data-cat="Grocery" id="tab-Grocery">
      Grocery<br><span style="font-weight:400;font-size:10px">78</span>
      <span class="badge-cnt" id="cnt-Grocery">0</span>
    </button>
    <button class="ctab cV" data-cat="Vegetables" id="tab-Vegetables">
      Veg<br><span style="font-weight:400;font-size:10px">47</span>
      <span class="badge-cnt" id="cnt-Vegetables">0</span>
    </button>
    <button class="ctab cS" data-cat="Supermarket">
      Super<br><span style="font-weight:400;font-size:10px">39</span>
      <span class="badge-cnt" id="cnt-Supermarket">0</span>
    </button>
    <button class="ctab cP" data-cat="Packaging">
      Pack<br><span style="font-weight:400;font-size:10px">19</span>
      <span class="badge-cnt" id="cnt-Packaging">0</span>
    </button>
  </div>

  <!-- Search -->
  <div class="srchwrap">
    <svg class="sico" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input type="text" id="srch" placeholder="Search items…" autocomplete="off">
  </div>
  <p class="scnt" id="scnt">Tap items to select</p>
  <div class="ilist" id="ilist"></div>

  <div class="btnrow">
    <button class="bsec" id="btn-b2">Back</button>
    <button class="bmain" id="btn-n2">Next — enter quantities</button>
  </div>
</div>

<!-- STEP 3: Quantities -->
<div class="step" id="s3">
  <div style="margin-bottom:10px">
    <div style="font-size:14px;font-weight:600;color:#1A1916;margin-bottom:2px">Enter quantities</div>
    <div style="font-size:12px;color:#7A7870" id="qty-sub"></div>
  </div>
  <div class="qlist" id="qlist"></div>
  <p class="slbl">Notes (optional)</p>
  <textarea id="f-notes" rows="2" placeholder="e.g. Higher usage — weekend event"></textarea>
  <div class="btnrow">
    <button class="bsec" id="btn-b3">Back</button>
    <button class="bmain grn" id="btn-sub">Submit to Google Sheet</button>
  </div>
  <div class="err" id="errbox"></div>
</div>

<!-- STEP 4: Success -->
<div class="step" id="s4">
  <div class="succ"><div class="tick"></div><h2>Saved ✓</h2><p id="done-txt"></p></div>
  <p class="slbl" style="margin-bottom:8px">Copy and send to manager on WhatsApp</p>
  <div class="wawrap"><div class="wamsg" id="wa-txt"></div></div>
  <button class="cpybtn" id="btn-cpy">📋 Copy WhatsApp message</button>
  <div class="cpdone" id="cpdone">✓ Copied!</div>
  <div class="btnrow" style="margin-top:8px"><button class="bmain" id="btn-rst">Log again</button></div>
</div>

</div>
<script>
var SCRIPT="https://script.google.com/macros/s/AKfycbw8H9mLYoy6yqFh0fFwuVMm2ovKg2wRH9bSwXI3fXnSTP67PtdZp_icYI9kfuDRgZrmUg/exec";

var ALL={
  Grocery:[["Ajinamoto","kg"],["Apalam","box"],["Atta (Chakki)","kg"],["Baking Soda","pack"],["Bay Leaves","g"],["Besan Flour","kg"],["Black Pepper","kg"],["Black Salt","g"],["Boiled Rice","bag"],["Cardamom Green","g"],["Cashew LP","box"],["Cashew Whole (Sweet)","box"],["Chana Dal","box"],["Chana Masala","nos"],["Chat Masala","nos"],["Chili Powder","kg"],["Chilly Whole Red","kg"],["Cinnamon","g"],["Cloves","g"],["Coconut Oil","box"],["Coriander Powder","kg"],["Coriander Seed","kg"],["Corn Flour","bag"],["Dates Big/Small","kg"],["Dry Ginger Powder","kg"],["Fennel Seed","kg"],["Fenugreek Seed","kg"],["Garam Masala","box"],["Ghee","box"],["Gingelly Oil","ltr"],["Idli Rice","bag"],["Jaggery","kg"],["Jeera Powder","kg"],["Jeera Whole","kg"],["Kashmiri Chili Powder","kg"],["Kashmiri Chilly Whole","kg"],["Khoa","g"],["Kitchen King Masala","nos"],["Maida","kg"],["Mix Dal","kg"],["Moong Dal","box"],["Mustard Seed","kg"],["Noodles","nos"],["Oil","box"],["Paneer","box"],["Pickle","nos"],["Pistachio / Pista","nos"],["Poppy Seed","kg"],["Rava","bag"],["Raw Rice","bag"],["Rice Basmati","kg"],["Rice Flour","kg"],["Sezwan Chutney","box"],["Soya","kg"],["Tamarind","kg"],["Tata Salt","bag"],["Toor Dal","bag"],["Turmeric Powder","kg"],["Urid Dal Whole","kg"],["Urid Split","bag"],["Vinegar","nos"],["White Chenna","bag"],["White Sugar","bag"],["Asafoetida (Hing)","g"],["Garlic Granules","g"],["Gulkand","nos"],["Mango Chutney","kg"],["Biryani Rice","kg"],["Chick Peas (Dried)","tin"],["Dates Small","kg"],["Hot Chili Whole","kg"],["Black Cardamom","pack"],["Black Split Urad Dal","kg"],["Jaljira Powder","nos"],["Nannari Syrup","nos"],["Pani Puri","nos"],["Tomato Ketchup","bottle"]],
  Vegetables:[["Alphonso (Mango Pulp)","box"],["Amla (Gooseberry)","kg"],["Baby Corn","box"],["Bajji Chili","kg"],["Beans","box"],["Bitter Gourd","box"],["Brinjal","kg"],["Broccoli","nos"],["Brown Onion","kg"],["Cabbage","nos"],["Carrot","bag"],["Celery","puch"],["Coffee Powder","box"],["Coriander","box"],["Cucumber","nos"],["Curd","nos"],["Curry Leaves","kg"],["Flat Beans","kg"],["Garlic","box"],["Ginger Fresh","box"],["Gobi","box"],["Green Caps","kg"],["Green Chili","kg"],["Ice Cubes","bag"],["Kesar","pack"],["Lemon","box"],["Lemon Grass","puch"],["Mint Leaf","puch"],["Mushroom","box"],["Orange","box"],["Palak","box"],["Papdi","nos"],["Potato","kg"],["Raw Banana","kg"],["Raw Sugar","kg"],["Red Cabbage","nos"],["Red Caps","kg"],["Red Onion","kg"],["Ridge Gourd","box"],["Sev","nos"],["Tea Powder","box"],["Tomato","box"],["Water","nos"],["Watermelon","nos"],["Yellow Pumpkin","nos"],["Boondhi","pack"],["Horlicks","nos"]],
  Supermarket:[["All Purpose Cleaner","ltr"],["Baby Corn Frozen","box"],["Butter 250/500","box"],["Cheese","pack"],["Chinese Veg","nos"],["Coke","nos"],["Coconut","box"],["Dishwashing Liquid","nos"],["Dishwashing Soap","nos"],["Drumstick","box"],["Fanta","nos"],["Floor Cleaner","nos"],["Floor Cleaner (Super)","ltr"],["Frozen Peas","kg"],["Full Cream Milk","ltr"],["Ginger Beer","nos"],["Glass Cleaner","ltr"],["Glitz (Domestic Cleaner)","bottle"],["Golden Milk","nos"],["Green Beans / Cut Beans","kg"],["Green Chili (Box)","box"],["Horlicks","nos"],["Ice Bags","bag"],["Jackfruit","box"],["Mixed Veg (Kurma)","nos"],["Mushroom Frozen (Cut/Whole)","nos"],["Small Onion","box"],["Snake Gourd","box"],["Solo","nos"],["Splenda / Sweetener","box"],["Sprite (2L/Can)","nos"],["Suran","box"],["Sweet Box","box"],["Thick Cream","nos"],["Water (Bottles)","nos"],["Watermelon","nos"],["White Bin Bags 20L","roll"],["White Rolls / Pav Buns","nos"],["Zero","nos"]],
  Packaging:[["250ml Container/Lid","box"],["500ml Container/Lid","box"],["Blue Cloth","nos"],["Chutney Cup/Lid (Small)","box"],["Cling Wrap","roll"],["Coffee Cup Holder Tray","box"],["Coffee Cups","box"],["Coffee Stirrers","pack"],["Dinner Napkins","box"],["Dishwashing Gloves","pair"],["Dosa Take Away","box"],["Foil Cover","pack"],["Garbage Bag","pack"],["Hairnet","pack"],["KOT Rolls Big","box"],["Straw / Foil Bags","pack"],["Take Away Bags Big/Small","box"],["Wash Room / Paper Towel","box"],["White Gloves","box"]]
};

var CATS=['Grocery','Vegetables','Supermarket','Packaging'];
var QCLS={Grocery:'qcG',Vegetables:'qcV',Supermarket:'qcS',Packaging:'qcP'};
// sel = {itemName: {cat, unit, qty}}
var sel={}, activeCat='Grocery';

document.getElementById('f-date').value=new Date().toISOString().split('T')[0];

function showStep(n){
  for(var i=1;i<=4;i++) document.getElementById('s'+i).className='step'+(i===n?' on':'');
  for(var i=1;i<=3;i++) document.getElementById('p'+i).className='pd'+(i<=n?' on':'');
  window.scrollTo(0,0);
}

function totalSelected(){return Object.keys(sel).length;}

function updateTotals(){
  var total=totalSelected();
  document.getElementById('s2-total').textContent=total?total+' item'+(total>1?'s':'')+' selected':'0 items selected';
  CATS.forEach(function(cat){
    var n=Object.keys(sel).filter(function(k){return sel[k].cat===cat;}).length;
    var el=document.getElementById('cnt-'+cat);
    if(el){el.textContent=n;el.className='badge-cnt'+(n>0?' show':'');}
  });
}

function renderItems(){
  var q=document.getElementById('srch').value.toLowerCase();
  var list=ALL[activeCat].filter(function(r){return !q||r[0].toLowerCase().indexOf(q)>=0;});
  var html='';
  if(!list.length){html='<div class="nores">No items found</div>';}
  else{
    for(var i=0;i<list.length;i++){
      var nm=list[i][0],un=list[i][1],on=sel[nm]&&sel[nm].cat===activeCat;
      html+='<div class="irow'+(on?' on':'')+'" data-n="'+nm+'" data-u="'+un+'" data-c="'+activeCat+'">'
        +'<div class="chk'+(on?' on':'')+'"></div>'
        +'<span class="iname">'+nm+'</span>'
        +'<span class="iunit">'+un+'</span>'
        +'</div>';
    }
  }
  document.getElementById('ilist').innerHTML=html;
  var n=Object.keys(sel).filter(function(k){return sel[k].cat===activeCat;}).length;
  document.getElementById('scnt').textContent=n?n+' selected in '+activeCat:'Tap items to select';

  document.getElementById('ilist').querySelectorAll('.irow').forEach(function(r){
    r.addEventListener('click',function(){
      var nm=this.getAttribute('data-n'),un=this.getAttribute('data-u'),cat=this.getAttribute('data-c');
      if(sel[nm]&&sel[nm].cat===cat) delete sel[nm];
      else sel[nm]={cat:cat,unit:un,qty:''};
      updateTotals();
      renderItems();
    });
  });
}

function switchTab(cat){
  activeCat=cat;
  document.querySelectorAll('.ctab').forEach(function(t){
    t.className='ctab c'+t.getAttribute('data-cat').charAt(0)+(t.getAttribute('data-cat')===cat?' on':'');
  });
  document.getElementById('srch').value='';
  renderItems();
}

// Tab clicks
document.querySelectorAll('.ctab').forEach(function(t){
  t.addEventListener('click',function(){switchTab(this.getAttribute('data-cat'));});
});

// Search
document.getElementById('srch').addEventListener('input',renderItems);

// Step 1 → 2
document.getElementById('btn-n1').addEventListener('click',function(){
  var d=new Date(document.getElementById('f-date').value+'T12:00:00');
  document.getElementById('s2-lbl').textContent=
    document.getElementById('f-store').value+' · '+d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  sel={};activeCat='Grocery';
  switchTab('Grocery');
  updateTotals();
  showStep(2);
});

// Step 2 back
document.getElementById('btn-b2').addEventListener('click',function(){showStep(1);});

// Step 2 → 3
document.getElementById('btn-n2').addEventListener('click',function(){
  if(!totalSelected()){alert('Please select at least one item');return;}
  document.getElementById('qty-sub').textContent=totalSelected()+' items across all categories';
  renderQty();
  showStep(3);
});

function renderQty(){
  var html='',lastCat='';
  // Sort by category order
  var keys=Object.keys(sel).sort(function(a,b){
    return CATS.indexOf(sel[a].cat)-CATS.indexOf(sel[b].cat);
  });
  for(var i=0;i<keys.length;i++){
    var nm=keys[i],info=sel[nm];
    if(info.cat!==lastCat){
      if(lastCat) html+='</div>';
      html+='<div style="padding:6px 14px;background:#F7F6F3;font-size:11px;font-weight:700;color:#7A7870;letter-spacing:.04em;border-bottom:1px solid #E2E0D8">'+info.cat.toUpperCase()+'</div>';
      lastCat=info.cat;
    }
    html+='<div class="qrow">'
      +'<span class="qname">'+nm+'</span>'
      +'<button class="qbtn" data-n="'+nm+'" data-d="-1">−</button>'
      +'<input class="qin" type="number" min="0" step="0.5" value="'+(info.qty||'')+'" placeholder="0" data-n="'+nm+'">'
      +'<span class="qunit">'+info.unit+'</span>'
      +'<button class="qbtn" data-n="'+nm+'" data-d="1">+</button>'
      +'</div>';
  }
  document.getElementById('qlist').innerHTML=html;

  document.getElementById('qlist').querySelectorAll('.qin').forEach(function(inp){
    inp.addEventListener('input',function(){sel[this.getAttribute('data-n')].qty=this.value;});
  });
  document.getElementById('qlist').querySelectorAll('.qbtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var n=this.getAttribute('data-n'),d=parseFloat(this.getAttribute('data-d'));
      var inp=document.querySelector('.qin[data-n="'+n+'"]');
      var v=Math.max(0,Math.round(((parseFloat(inp.value)||0)+d)*10)/10);
      inp.value=v;sel[n].qty=v;
    });
  });
}

// Step 3 back
document.getElementById('btn-b3').addEventListener('click',function(){showStep(2);});

// Submit
document.getElementById('btn-sub').addEventListener('click',function(){
  var btn=this,err=document.getElementById('errbox');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Saving…';

  var store=document.getElementById('f-store').value;
  var who=document.getElementById('f-who').value;
  var date=document.getElementById('f-date').value;
  var notes=document.getElementById('f-notes').value;

  // Build entries grouped by category — send one batch
  var entries=Object.keys(sel).map(function(item){
    return{item:item,unit:sel[item].unit,qty:parseFloat(sel[item].qty)||0,category:sel[item].cat};
  });

  fetch(SCRIPT,{method:'POST',mode:'no-cors',body:JSON.stringify({
    store:store,category:'Multiple',date:date,loggedBy:who,notes:notes,entries:entries
  })})
  .then(function(){
    var d=new Date(date+'T12:00:00'),ds=d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
    document.getElementById('done-txt').textContent=entries.length+' items across '+
      CATS.filter(function(c){return entries.some(function(e){return e.category===c;});}).length+' categories · '+ds;

    // Build WhatsApp message grouped by category
    var waLines='*A2B Consumption Log*\n'+store+' · '+ds+'\nLogged by: '+who+'\n';
    CATS.forEach(function(cat){
      var catEntries=entries.filter(function(e){return e.category===cat;});
      if(catEntries.length){
        waLines+='\n*'+cat+'*\n';
        catEntries.forEach(function(e){waLines+='  • '+e.item+': '+e.qty+' '+e.unit+'\n';});
      }
    });
    if(notes) waLines+='\nNote: '+notes;
    document.getElementById('wa-txt').textContent=waLines.trim();
    showStep(4);
  })
  .catch(function(e){
    btn.disabled=false;btn.innerHTML='Submit to Google Sheet';
    err.style.display='block';err.textContent='Error: '+e.message;
  });
});

// Copy
document.getElementById('btn-cpy').addEventListener('click',function(){
  var txt=document.getElementById('wa-txt').textContent,done=document.getElementById('cpdone');
  try{
    navigator.clipboard.writeText(txt).then(function(){done.style.display='block';setTimeout(function(){done.style.display='none';},2000);});
  }catch(e){
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    done.style.display='block';setTimeout(function(){done.style.display='none';},2000);
  }
});

// Reset
document.getElementById('btn-rst').addEventListener('click',function(){
  sel={};document.getElementById('f-notes').value='';
  activeCat='Grocery';showStep(1);
});
</script>
</body>
</html>
